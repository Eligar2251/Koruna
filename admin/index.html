<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка каталога — РегионЛес</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <main id="koruna-admin" class="admin">
    <section id="login" class="panel login">
      <p class="eyebrow">РегионЛес</p>
      <h1>Товары и разделы</h1>
      <p class="lead">Здесь добавляются разделы и товары. На сайте остаются только опубликованные.</p>
      <form id="login-form">
        <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Войти</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="app" class="app" hidden>
      <header class="top">
        <div>
          <p class="eyebrow">Админка</p>
          <h1>Каталог</h1>
        </div>
        <div class="top-actions">
          <span id="mode" class="mode"></span>
          <a href="/katalog.html">На сайт</a>
          <button type="button" id="logout">Выйти</button>
        </div>
      </header>

      <div class="layout">
        <section class="panel">
          <h2>Раздел</h2>
          <form id="category-form">
            <input type="hidden" name="id">
            <label>Название<input name="name" required maxlength="200"></label>
            <label>Страница сайта
              <select name="page" id="page-slug"></select>
            </label>
            <label>Адрес (slug)<input name="slug" maxlength="80" pattern="[a-z0-9-]*" placeholder="заполнится из названия"></label>
            <label>Описание<textarea name="description" maxlength="2000" rows="3"></textarea></label>
            <label>Порядок<input name="sort_order" type="number" value="0"></label>
            <label class="check"><input name="is_active" type="checkbox" checked> Показывать на сайте</label>
            <div class="row">
              <button type="submit">Сохранить раздел</button>
              <button type="button" id="category-reset" class="ghost">Новый</button>
            </div>
            <p class="error" hidden></p>
          </form>
          <ul id="categories" class="list"></ul>
        </section>

        <section class="panel">
          <h2>Товар</h2>
          <form id="product-form">
            <input type="hidden" name="id">
            <label>Название<input name="name" required maxlength="300"></label>
            <label>Раздел<select name="category_id" id="product-category"></select></label>
            <div class="split">
              <label>Артикул<input name="sku" maxlength="80"></label>
              <label>Единица<input name="unit" value="шт" maxlength="30" required></label>
            </div>
            <div class="split">
              <label>Цена, ₽<input name="price" inputmode="decimal" placeholder="пусто — по запросу"></label>
              <label>Порядок<input name="sort_order" type="number" value="0"></label>
            </div>
            <label>Описание<textarea name="description" maxlength="10000" rows="4"></textarea></label>
            <label>Фото<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
            <img id="preview" alt="" hidden>
            <label class="check"><input name="clear_image" type="checkbox"> Убрать текущее фото</label>
            <label class="check"><input name="in_stock" type="checkbox" checked> В наличии</label>
            <label class="check"><input name="is_active" type="checkbox" checked> Опубликовать</label>
            <div class="row">
              <button type="submit">Сохранить товар</button>
              <button type="button" id="product-reset" class="ghost">Новый</button>
            </div>
            <p class="error" hidden></p>
          </form>
          <ul id="products" class="list"></ul>
        </section>
      </div>
    </section>
  </main>
  <script src="/assets/admin.js" type="module"></script>
</body>
</html>
